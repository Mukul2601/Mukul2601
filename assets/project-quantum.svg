    <circle cx="430" cy="40" r="80" fill="#8b5cf6" opacity="0.55" filter="url(#blur)"/>
    <rect x="12" y="12" width="476" height="216" rx="22" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.2"/>
    <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="36" y="58" font-size="26">🧠</text>
      <text x="76" y="57" font-size="19" font-weight="700" fill="#f8fafc">QuantumBrainCybersecurity</text>
      <text x="36" y="102" font-size="14.5" fill="#cbd5e1">A mini-project exploring where quantum computing</text>
      <text x="36" y="124" font-size="14.5" fill="#cbd5e1">and brain-computer interfaces converge.</text>
      <g transform="translate(36,160)" font-size="12.5" fill="#ede9fe" text-anchor="middle">
        <rect width="86" height="28" rx="14" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-opacity="0.55"/><text x="43" y="18">Quantum</text>
        <rect x="96" width="50" height="28" rx="14" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-opacity="0.55"/><text x="121" y="18">BCI</text>
        <rect x="156" width="108" height="28" rx="14" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-opacity="0.55"/><text x="210" y="18">Cybersecurity</text>
      </g>
      <text x="36" y="214" font-size="13" fill="#c4b5fd">View repository →</text>
    </g>
