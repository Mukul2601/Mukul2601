<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220" role="img" aria-label="Applied AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#16264a"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.16"/><stop offset="1" stop-color="#fff" stop-opacity="0.04"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.5"/><stop offset="1" stop-color="#36bcf7" stop-opacity="0.45"/></linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
    <clipPath id="clip"><rect width="400" height="220" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="400" height="220" fill="url(#bg)"/>
    <circle cx="70" cy="40" r="70" fill="#36bcf7" opacity="0.6" filter="url(#blur)"/>
    <rect x="12" y="12" width="376" height="196" rx="20" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.2"/>
    <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="34" y="56" font-size="26">🤖</text>
      <text x="74" y="55" font-size="20" font-weight="700" fill="#f8fafc">Applied AI</text>
      <line x1="34" y1="76" x2="366" y2="76" stroke="#fff" stroke-opacity="0.15"/>
      <text x="34" y="108" font-size="15" fill="#e2e8f0">• Multi-agent systems &amp; LLM apps</text>
      <text x="34" y="138" font-size="15" fill="#e2e8f0">• RAG &amp; prompt engineering</text>
      <text x="34" y="168" font-size="15" fill="#e2e8f0">• Workflow automation (n8n, Zapier)</text>
    </g>
  </g>
</svg>
