<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Mukul Mogha, AI Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="1" stop-color="#14213d"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#36bcf7" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <clipPath id="clip"><rect width="1000" height="300" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <g filter="url(#blur)">
      <circle cx="170" cy="70" r="110" fill="#36bcf7" opacity="0.65">
        <animateTransform attributeName="transform" type="translate" values="0,0;60,40;0,0" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="820" cy="240" r="130" fill="#8b5cf6" opacity="0.6">
        <animateTransform attributeName="transform" type="translate" values="0,0;-70,-30;0,0" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle cx="560" cy="40" r="90" fill="#14b8a6" opacity="0.5">
        <animateTransform attributeName="transform" type="translate" values="0,0;40,60;0,0" dur="10s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect x="40" y="40" width="920" height="220" rx="28" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.5"/>
    <rect x="41" y="41" width="918" height="70" rx="27" fill="#ffffff" opacity="0.04"/>

    <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="90" y="125" font-size="58" font-weight="700" fill="url(#name)" letter-spacing="-1">Mukul Mogha</text>
      <text x="92" y="165" font-size="22" fill="#e2e8f0" opacity="0.92">AI Engineer · Multi-Agent Systems · Cloud</text>

      <g transform="translate(92,196)">
        <rect width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.25"/>
        <text x="75" y="22" font-size="14" fill="#f1f5f9" text-anchor="middle">ENGIE UK</text>
        <rect x="162" width="130" height="34" rx="17" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.25"/>
        <text x="227" y="22" font-size="14" fill="#f1f5f9" text-anchor="middle">London, UK</text>
        <rect x="304" width="170" height="34" rx="17" fill="#36bcf7" fill-opacity="0.22" stroke="#36bcf7" stroke-opacity="0.6"/>
        <circle cx="326" cy="17" r="5" fill="#4ade80">
          <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
        </circle>
        <text x="400" y="22" font-size="14" fill="#e0f2fe" text-anchor="middle">Building agents</text>
      </g>
    </g>
  </g>
</svg>
