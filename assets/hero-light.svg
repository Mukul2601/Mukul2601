<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="396" viewBox="0 0 1000 396" fill="none" role="img" aria-label="Mukul Mogha — Apple-style Profile Hero">
  <defs>
    <style>
      @keyframes barWave1 {
        0%, 100% { height: 6px; y: 40px; }
        50% { height: 14px; y: 36px; }
      }
      @keyframes barWave2 {
        0%, 100% { height: 13px; y: 36.5px; }
        50% { height: 5px; y: 40.5px; }
      }
      @keyframes barWave3 {
        0%, 100% { height: 8px; y: 39px; }
        50% { height: 15px; y: 35.5px; }
      }
      .eq-1 { animation: barWave1 1.4s ease-in-out infinite; }
      .eq-2 { animation: barWave2 1.1s ease-in-out infinite; }
      .eq-3 { animation: barWave3 1.6s ease-in-out infinite; }
      .eq-4 { animation: barWave1 1.25s ease-in-out 0.3s infinite; }
    </style>

    <linearGradient id="apple-intel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066CC">
        <animate attributeName="stop-color" values="#0066CC;#8944AB;#D70040;#0066CC" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="48%" stop-color="#8944AB">
        <animate attributeName="stop-color" values="#8944AB;#D70040;#C96900;#8944AB" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#D70040">
        <animate attributeName="stop-color" values="#D70040;#C96900;#0066CC;#D70040" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="top-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0066CC" stop-opacity="0"/>
      <stop offset="30%" stop-color="#0066CC" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#8944AB" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#D70040" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#D70040" stop-opacity="0"/>
    </linearGradient>

    <filter id="aura-blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="56"/>
    </filter>

    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1D1D1F" fill-opacity="0.045"/>
    </pattern>

    <radialGradient id="grid-mask-grad" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="grid-mask">
      <rect width="1000" height="396" fill="url(#grid-mask-grad)"/>
    </mask>

    <clipPath id="hero-clip">
      <rect width="1000" height="396" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#hero-clip)">
    <rect width="1000" height="396" rx="28" fill="#F5F5F7"/>

    <g filter="url(#aura-blur)" opacity="0.22">
      <ellipse cx="260" cy="95" rx="190" ry="110" fill="#0066CC">
        <animateTransform attributeName="transform" type="translate" values="0,0; 70,25; 0,0" dur="14s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="730" cy="115" rx="200" ry="115" fill="#8944AB">
        <animateTransform attributeName="transform" type="translate" values="0,0; -65,30; 0,0" dur="16s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="510" cy="240" rx="180" ry="95" fill="#D70040" opacity="0.7">
        <animateTransform attributeName="transform" type="translate" values="0,0; 35,-30; 0,0" dur="12s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <rect width="1000" height="396" fill="url(#dot-grid)" mask="url(#grid-mask)"/>

    <rect x="120" y="0.5" width="760" height="1.5" fill="url(#top-sheen)"/>

    <!-- Apple Dynamic Island Live Pill -->
    <g>
      <rect x="275" y="25" width="450" height="36" rx="18" fill="#1D1D1F" stroke="rgba(0, 0, 0, 0.20)" stroke-width="1"/>
      <circle cx="300" cy="43" r="4" fill="#30D158">
        <animate attributeName="r" values="4;9;4" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.65;0;0.65" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="300" cy="43" r="4" fill="#30D158"/>
      <text x="492" y="47.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Inter, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#F5F5F7" letter-spacing="0.1">ENGIE UK  ·  Application Manager  ·  London, UK</text>

      <!-- Live Activity Equalizer -->
      <rect class="eq-1" x="688" y="40" width="2.5" height="6" rx="1.25" fill="#0066CC"/>
      <rect class="eq-2" x="693" y="36.5" width="2.5" height="13" rx="1.25" fill="#8944AB"/>
      <rect class="eq-3" x="698" y="39" width="2.5" height="8" rx="1.25" fill="#D70040"/>
      <rect class="eq-4" x="703" y="40" width="2.5" height="6" rx="1.25" fill="#C96900"/>
    </g>

    <!-- Keynote Headline -->
    <g class="hero-title">
      <text x="500" y="96" text-anchor="middle" font-family="'SF Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="2.8" fill="#86868B">MUKUL MOGHA  ·  AI ENGINEER  ·  MSC CLOUD COMPUTING</text>
      <text x="500" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Inter, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.6" fill="#1D1D1F">Multi-agent intelligence.</text>
      <text x="500" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Inter, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.6" fill="url(#apple-intel)">Engineered for production.</text>
    </g>

    <g class="hero-sub">
      <text x="500" y="250" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Inter, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#515154">AI Engineer (Application Manager) at ENGIE UK — architecting autonomous workflows,</text>
      <text x="500" y="273" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Inter, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#515154">resilient cloud infrastructure, and zero-trust AI supply chains.</text>
    </g>

    <!-- Bottom Spec Dock -->
    
      <g>
        <rect x="34" y="304" width="224" height="64" rx="16" fill="#F8F8FA" fill-opacity="0.90" stroke="rgba(0, 0, 0, 0.08)" stroke-width="1">
          <animate attributeName="stroke" values="rgba(0, 0, 0, 0.08);#0066CC;rgba(0, 0, 0, 0.08)" dur="5.6s" begin="0.0s" repeatCount="indefinite"/>
        </rect>
        <line x1="50" y1="304.5" x2="242" y2="304.5" stroke="rgba(255, 255, 255, 0.90)" stroke-width="1" stroke-opacity="0.5"/>
        <g transform="translate(50, 318)" fill="none" stroke="#0066CC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 1.5L9.8 6.2L14.5 8L9.8 9.8L8 14.5L6.2 9.8L1.5 8L6.2 6.2Z"/>
      </g>
        <text x="72" y="330" font-family="'SF Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="600" letter-spacing="1.2" fill="#86868B">CURRENT ROLE</text>
        <text x="52" y="352" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1D1D1F">ENGIE UK · App Manager</text>
      </g>

      <g>
        <rect x="270" y="304" width="224" height="64" rx="16" fill="#F8F8FA" fill-opacity="0.90" stroke="rgba(0, 0, 0, 0.08)" stroke-width="1">
          <animate attributeName="stroke" values="rgba(0, 0, 0, 0.08);#8944AB;rgba(0, 0, 0, 0.08)" dur="5.6s" begin="1.4s" repeatCount="indefinite"/>
        </rect>
        <line x1="286" y1="304.5" x2="478" y2="304.5" stroke="rgba(255, 255, 255, 0.90)" stroke-width="1" stroke-opacity="0.5"/>
        <g transform="translate(286, 318)" fill="none" stroke="#8944AB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="4" cy="8" r="2.2"/>
        <circle cx="12" cy="4" r="2.2"/>
        <circle cx="12" cy="12" r="2.2"/>
        <path d="M6 7L10 5M6 9L10 11"/>
      </g>
        <text x="308" y="330" font-family="'SF Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="600" letter-spacing="1.2" fill="#86868B">CORE ARCHITECTURE</text>
        <text x="288" y="352" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1D1D1F">Multi-Agent &amp; RAG</text>
      </g>

      <g>
        <rect x="506" y="304" width="224" height="64" rx="16" fill="#F8F8FA" fill-opacity="0.90" stroke="rgba(0, 0, 0, 0.08)" stroke-width="1">
          <animate attributeName="stroke" values="rgba(0, 0, 0, 0.08);#0077ED;rgba(0, 0, 0, 0.08)" dur="5.6s" begin="2.8s" repeatCount="indefinite"/>
        </rect>
        <line x1="522" y1="304.5" x2="714" y2="304.5" stroke="rgba(255, 255, 255, 0.90)" stroke-width="1" stroke-opacity="0.5"/>
        <g transform="translate(522, 318)" fill="none" stroke="#0077ED" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.5 12.5H11.8C13.6 12.5 15 11.1 15 9.3C15 7.6 13.7 6.2 12 6.1C11.5 3.8 9.5 2.2 7.1 2.2C4.3 2.2 2.1 4.4 2.1 7.2C2.1 7.5 2.1 7.8 2.2 8.1C1.4 8.6 1 9.5 1 10.4C1 11.6 2 12.5 3.2 12.5H4.5Z"/>
      </g>
        <text x="544" y="330" font-family="'SF Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="600" letter-spacing="1.2" fill="#86868B">CLOUD &amp; DELIVERY</text>
        <text x="524" y="352" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1D1D1F">Azure · AWS · GitOps IaC</text>
      </g>

      <g>
        <rect x="742" y="304" width="224" height="64" rx="16" fill="#F8F8FA" fill-opacity="0.90" stroke="rgba(0, 0, 0, 0.08)" stroke-width="1">
          <animate attributeName="stroke" values="rgba(0, 0, 0, 0.08);#1E9E44;rgba(0, 0, 0, 0.08)" dur="5.6s" begin="4.2s" repeatCount="indefinite"/>
        </rect>
        <line x1="758" y1="304.5" x2="950" y2="304.5" stroke="rgba(255, 255, 255, 0.90)" stroke-width="1" stroke-opacity="0.5"/>
        <g transform="translate(758, 318)" fill="none" stroke="#1E9E44" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 1.5L13.5 3.8V7.8C13.5 11.2 11.2 13.8 8 14.8C4.8 13.8 2.5 11.2 2.5 7.8V3.8L8 1.5Z"/>
        <path d="M5.8 8.1L7.3 9.6L10.4 6.5"/>
      </g>
        <text x="780" y="330" font-family="'SF Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="600" letter-spacing="1.2" fill="#86868B">TRUST &amp; SAFETY</text>
        <text x="760" y="352" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1D1D1F">SBOM &amp; AI Guardrails</text>
      </g>

    <rect x="0.75" y="0.75" width="998.5" height="394.5" rx="27.25" stroke="rgba(0, 0, 0, 0.08)" stroke-width="1.5"/>
  </g>
</svg>